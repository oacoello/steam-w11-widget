[package]
name = "steam-w11-widget"
version = "0.1.0"
edition = "2021"

[dependencies]
windows = { version = "0.61.3", features = [
    "Foundation",
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_Com",
    "Win32_System_WinRT",
    "Win32_System_Registry",
    "Win32_System_Threading",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
    "Win32_Graphics_Gdi",
] }
windows-core = "0.61.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
base64 = "0.22.1"
image = { version = "0.25.10", default-features = false, features = ["jpeg", "png", "ico"] }
